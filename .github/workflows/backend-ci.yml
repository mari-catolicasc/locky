name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locky
          POSTGRES_PASSWORD: locky
          POSTGRES_DB: locky_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://locky:locky@localhost:5432/locky_test
      TEST_DATABASE_URL: postgresql+psycopg://locky:locky@localhost:5432/locky_test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sincronizar dependências
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format (ruff)
        run: uv run ruff format --check .
      - name: Tipos (mypy)
        run: uv run mypy app
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Testes + cobertura
        run: uv run pytest
